    --bg: #070605;
    --panel: #0e0c09;
    --field: #080706;
    --ivory: #f4eee2;
    --muted: #a39984;
    --gold-1: #8a6425;
    --gold-2: #d9b26f;
    --gold-3: #f9e7b8;
    --gold-4: #b8873b;
    --line: rgba(217, 178, 111, .26);
    --line-soft: rgba(217, 178, 111, .14);
    --ok: #3ddc97;
    --ok-soft: rgba(61, 220, 151, .13);
    --err: #ff7d73;
    --err-soft: rgba(255, 125, 115, .12);
    --ink: #1b1306;
    --gold: linear-gradient(110deg, #8a6425 0%, #d9b26f 20%, #f9e7b8 38%, #c99a4b 56%, #f3d58f 76%, #9c7230 100%);
    --display: "Josefin Sans", "Segoe UI", system-ui, sans-serif;
    --body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; display: flex;
    font-family: var(--body); color: var(--ivory);
    background:
      radial-gradient(55% 38% at 50% 15%, rgba(217, 178, 111, .13), transparent 72%),
      var(--bg);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 520px; margin: auto; padding: 44px 20px 56px; text-align: center; }

  /* ---------- Logo emas mengkilap ---------- */
  .logo {
    position: relative; width: min(290px, 70vw); aspect-ratio: 440 / 442; margin: 0 auto 6px;
    background: var(--logo) center / contain no-repeat;
    filter: saturate(1.7) contrast(1.12) brightness(1.1) drop-shadow(0 0 22px rgba(232, 190, 110, .4));
    animation: halo 3.2s ease-in-out infinite;
  }
  .logo::before {           /* napas cahaya emas di bentuk logo */
    content: ""; position: absolute; inset: 0;
    -webkit-mask: var(--logo) center / contain no-repeat;
            mask: var(--logo) center / contain no-repeat;
    background: radial-gradient(circle at 50% 36%, rgba(255, 205, 110, .75), rgba(255, 190, 90, .25) 38%, transparent 62%);
    mix-blend-mode: plus-lighter; animation: breathe 3.2s ease-in-out infinite;
  }
  .logo::after {            /* kilau yang menyapu bentuk logo */
    content: ""; position: absolute; inset: 0;
    -webkit-mask: var(--logo) center / contain no-repeat;
            mask: var(--logo) center / contain no-repeat;
    background: linear-gradient(105deg, transparent 0 26%, rgba(255, 214, 120, .65) 40%, #ffffff 50%, rgba(255, 214, 120, .65) 60%, transparent 74% 100%);
    background-size: 300% 100%; background-position: 100% 0;
    mix-blend-mode: plus-lighter;
    animation: glint 3.4s cubic-bezier(.45, 0, .2, 1) infinite;
  }
  .spark {
    position: absolute; width: var(--s, 12px); height: var(--s, 12px);
    background: #fff4d0; opacity: 0; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    filter: drop-shadow(0 0 6px rgba(255, 226, 150, .9));
    animation: twinkle 2.4s ease-in-out infinite;
  }

  /* ---------- Judul ---------- */
  h1 {
    font-family: var(--display); font-weight: 300; margin: 18px 0 8px;
    font-size: clamp(1.7rem, 6vw, 2.3rem); letter-spacing: .04em; line-height: 1.15;
    background: linear-gradient(100deg, #9c7230 0%, #e3bd78 18%, #fffbe8 34%, #d9b26f 50%, #fff1c2 66%, #b8873b 82%, #f3d58f 100%); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(232, 190, 110, .3));
    animation: goldflow 4s ease-in-out infinite alternate;
  }
  .lede { margin: 0 auto; max-width: 40ch; color: var(--muted); font-size: 1.02rem; }

  /* ---------- Status koneksi ---------- */
  .status {
    --c: #f5b942;
    display: inline-flex; align-items: center; justify-content: center; gap: 11px; margin-top: 22px; max-width: 100%; text-align: left;
    padding: 8px 16px 8px 13px; border-radius: 999px;
    background: rgba(255, 255, 255, .035); border: 1px solid var(--line-soft);
    color: var(--ivory); font: inherit; font-size: .9rem; font-weight: 500;
    cursor: default; transition: background .25s, border-color .25s;
  }
  .status[data-state="ok"]    { --c: var(--ok); background: var(--ok-soft); border-color: rgba(61, 220, 151, .4); }
  .status[data-state="error"] { --c: var(--err); background: var(--err-soft); border-color: rgba(255, 125, 115, .45); cursor: pointer; }
  .status[data-state="error"]:hover { background: rgba(255, 125, 115, .2); }
  .status:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 3px; }
  .dot { position: relative; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); transition: background .25s; }
  .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); animation: ripple 1.7s ease-out infinite; }
  .status[data-state="connecting"] .dot { animation: blink 1s ease-in-out infinite; }
  .status[data-state="error"] .dot::after { animation: ripple 1s ease-out infinite; }
  .status[data-state="ok"] .dot { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  .st-text { animation: fadein .3s ease-out; }
  .st-retry { display: none; color: var(--muted); font-size: .84rem; }
  .status[data-state="error"] .st-retry { display: inline; }

  /* ---------- Panel kode ---------- */
  .panel {
    margin-top: 30px; padding: 24px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 34px 60px -32px #000, inset 0 1px 0 rgba(255, 236, 190, .08);
  }
  label { display: block; font-weight: 500; font-size: .95rem; color: var(--gold-2); margin-bottom: 10px; }
  .field { display: flex; gap: 10px; }
  .field input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.2rem; font-weight: 500;
    letter-spacing: .1em; color: var(--ivory); background: var(--field);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; outline: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder { color: #6f6757; font-weight: 400; letter-spacing: 0; }
  .field input:focus { border-color: var(--gold-2); box-shadow: 0 0 0 3px rgba(217, 178, 111, .18); }
  .field input.bad { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-soft); animation: shake .35s; }
  .hint { margin: 12px 2px 0; color: var(--muted); font-size: .88rem; }

  /* Tombol emas */
  .btn, .open {
    position: relative; overflow: hidden; isolation: isolate;
    font: inherit; font-weight: 600; font-size: 1rem; letter-spacing: .03em; cursor: pointer;
    border: 0; border-radius: 12px; padding: 0 24px; color: var(--ink);
    background: var(--gold); background-size: 220% 100%; background-position: 0 0;
    box-shadow: 0 10px 24px -12px rgba(217, 178, 111, .7), inset 0 1px 0 rgba(255, 255, 255, .45);
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    transition: background-position .5s, transform .1s, box-shadow .2s;
  }
  .btn:hover, .open:hover { background-position: 100% 0; box-shadow: 0 14px 30px -12px rgba(240, 205, 130, .85), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .btn:active, .open:active { transform: translateY(1px); }
  .btn:disabled { opacity: .65; cursor: progress; }
  .btn::after, .open::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 50%; z-index: -1;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .95), transparent);
    transform: skewX(-20deg); animation: shine 3.2s .8s ease-in-out infinite;
  }
  .btn:focus-visible, .open:focus-visible { outline: 2px solid var(--gold-3); outline-offset: 3px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; }

  /* ---------- Hasil ---------- */
  #result { margin-top: 18px; }
  .card { border-radius: 18px; padding: 22px; border: 1px solid var(--line); background: var(--panel); animation: rise .3s ease-out; text-align: left; }
  .card.fail { border-color: rgba(255, 125, 115, .5); background: #170d0c; }
  .fail h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--err); }
  .fail p { margin: 0; font-size: .95rem; color: var(--ivory); }

  .found { text-align: center; padding: 30px 22px 24px; border-color: rgba(217, 178, 111, .55); box-shadow: 0 0 40px -14px rgba(217, 178, 111, .45); }
  .found-ico {
    width: 66px; height: 66px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; color: var(--ink);
    background: var(--gold); box-shadow: 0 0 28px rgba(240, 205, 130, .5), inset 0 1px 0 rgba(255, 255, 255, .5);
    animation: pop .55s cubic-bezier(.2, 1.6, .4, 1);
  }
  .found h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 1.5rem; letter-spacing: .04em; color: var(--gold-3); }
  .found p { margin: 0 0 22px; color: var(--muted); }
  .found .open { width: 100%; padding: 15px 24px; font-size: 1.05rem; }

  /* ---------- Notifikasi ---------- */
  .notice {
    position: fixed; top: 16px; left: 50%; z-index: 20;
    transform: translate(-50%, -160%);
    display: flex; align-items: center; gap: 12px; text-align: left;
    width: max-content; max-width: calc(100% - 32px);
    background: #15120d; color: var(--ivory);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px 18px 14px 12px;
    box-shadow: 0 20px 44px -14px #000, 0 0 0 1px rgba(0, 0, 0, .4);
    transition: transform .55s cubic-bezier(.2, 1.3, .35, 1); pointer-events: none;
  }
  .notice.show { transform: translate(-50%, 0); }
  .notice::after {
    content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px;
    border-radius: 3px; background: var(--n); transform-origin: left; transform: scaleX(0);
  }
  .notice.show::after { animation: drain 3.6s linear forwards; }
  .notice.ok { --n: var(--ok); }
  .notice.error { --n: var(--err); }
  .n-ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--n); background: var(--ok-soft); }
  .notice.error .n-ico { background: var(--err-soft); }
  .notice.show .n-ico svg { animation: pop .5s .15s cubic-bezier(.2, 1.6, .4, 1) both; }
  .n-title { display: block; font-weight: 600; font-size: .95rem; }
  .n-sub { display: block; color: var(--muted); font-size: .84rem; }

  /* ---------- Animasi ---------- */
  @keyframes glint   { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
  @keyframes breathe { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes halo    { 0%, 100% { filter: saturate(1.7) contrast(1.12) brightness(1.06) drop-shadow(0 0 16px rgba(232, 190, 110, .28)); } 50% { filter: saturate(1.8) contrast(1.14) brightness(1.18) drop-shadow(0 0 34px rgba(255, 205, 120, .62)); } }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
  @keyframes goldflow { from { background-position: 0 0; } to { background-position: 100% 0; } }
  @keyframes shine   { 0% { left: -60%; } 38%, 100% { left: 130%; } }
  @keyframes ripple  { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes blink   { 50% { opacity: .35; } }
  @keyframes pop     { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  @keyframes fadein  { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes drain   { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes rise    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes shake   { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  @keyframes rot     { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .spark { opacity: .8; } }
  @media (max-width: 480px) {
    main { padding-top: 28px; }
    .status[data-state="error"] .st-retry { display: none; }
    .field { flex-direction: column; }
    .btn { padding: 15px 24px; }
  }
</style>
</head>
<body>

<main>
  <div class="logo" role="img" aria-label="Logo ExamDigital by Rahestadev">
    <span class="spark" style="left:40%;top:25%;--s:20px;animation-delay:.1s"></span>
    <span class="spark" style="left:60%;top:42%;--s:16px;animation-delay:.8s"></span>
    <span class="spark" style="left:46%;top:52%;--s:12px;animation-delay:1.5s"></span>
    <span class="spark" style="left:64%;top:20%;--s:15px;animation-delay:2.1s"></span>
    <span class="spark" style="left:34%;top:44%;--s:11px;animation-delay:.5s"></span>
    <span class="spark" style="left:54%;top:30%;--s:13px;animation-delay:1.1s"></span>
    <span class="spark" style="left:72%;top:58%;--s:10px;animation-delay:1.8s"></span>
    <span class="spark" style="left:26%;top:22%;--s:9px;animation-delay:2.4s"></span>
  </div>

  <h1>Masukkan kode akses</h1>
  <p class="lede">Tautan hanya akan terbuka jika kode yang Anda masukkan benar.</p>

  <button class="status" id="status" type="button" data-state="connecting" disabled aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span class="st-text" id="stText">Menghubungkan ke spreadsheet…</span>
    <span class="st-retry">Ketuk untuk coba lagi</span>
  </button>

  <form class="panel" id="form" autocomplete="off" novalidate>
    <label for="kode">Kode akses</label>
    <div class="field">
      <input id="kode" name="kode" type="text" placeholder="Ketik kode di sini" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button class="btn" id="submit" type="submit"><span id="btnLabel">Cek kode</span></button>
    </div>
    <p class="hint">Tidak ada daftar link yang ditampilkan di halaman ini.</p>
  </form>

  <div id="result" aria-live="polite"></div>
</main>

<div class="notice" id="notice" role="status" aria-live="polite">
  <div class="n-ico" id="nIco"></div>
  <div><span class="n-title" id="nTitle"></span><span class="n-sub" id="nSub"></span></div>
</div>

<script>
  // URL Web App Apps Script (hardcode)
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbw-SG-fCtPp4P_aDPGCLWFQRLFsLh8lEgrXuf__u78JfY81MYKr9coZuEZ4KvG1l15a3Q/exec";

  const form = document.getElementById("form");
  const input = document.getElementById("kode");
  const submit = document.getElementById("submit");
  const label = document.getElementById("btnLabel");
  const result = document.getElementById("result");

  /* ---------- Status koneksi & notifikasi ---------- */
  const statusEl = document.getElementById("status");
  const noticeEl = document.getElementById("notice");
  const nIco = document.getElementById("nIco");
  const nTitle = document.getElementById("nTitle");
  const nSub = document.getElementById("nSub");
  let noticeTimer;

  const STATUS_TEXT = {
    connecting: "Menghubungkan ke spreadsheet…",
    ok: "Tersambung ke spreadsheet",
    error: "Belum tersambung ke spreadsheet"
  };
  const SVG_OK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const SVG_ERR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function setStatus(state) {
    if (statusEl.dataset.state === state) return;
    statusEl.dataset.state = state;
    statusEl.disabled = state !== "error";
    // ganti elemen teks agar animasi fade-in diputar ulang
    const old = document.getElementById("stText");
    const fresh = old.cloneNode(false);
    fresh.textContent = STATUS_TEXT[state];
    old.replaceWith(fresh);
  }

  function notify(type, title, sub) {
    clearTimeout(noticeTimer);
    noticeEl.classList.remove("show");
    void noticeEl.offsetWidth; // restart animasi
    noticeEl.className = "notice " + type;
    nIco.innerHTML = type === "ok" ? SVG_OK : SVG_ERR;
    nTitle.textContent = title;
    nSub.textContent = sub || "";
    requestAnimationFrame(() => noticeEl.classList.add("show"));
    noticeTimer = setTimeout(() => noticeEl.classList.remove("show"), 3600);
  }

  async function checkConnection() {
    setStatus("connecting");
    const minWait = new Promise(r => setTimeout(r, 900)); // beri waktu animasi "menghubungkan"
    try {
      const res = await fetch(EXEC_URL + "?ping=1", { redirect: "follow" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json.connected !== true) {
        throw new Error(json.error === "Kode belum diisi"
          ? "Code.gs belum diperbarui. Deploy ulang versi terbaru."
          : (json.error || "Spreadsheet tidak merespons"));
      }
      await minWait;
      setStatus("ok");
      notify("ok", "Tersambung ke spreadsheet", "Anda bisa memasukkan kode sekarang.");
    } catch (err) {
      await minWait;
      setStatus("error");
      notify("error", "Belum tersambung ke spreadsheet", err.message);
    }
  }

  statusEl.addEventListener("click", checkConnection);

  function parse(u) {
    try {
      const url = new URL(u);
      return /^https?:$/.test(url.protocol) ? url : null;
    } catch (e) { return null; }
  }

  function setLoading(on) {
    submit.disabled = on;
    label.innerHTML = on ? '<span class="spinner" aria-hidden="true"></span>' : "Cek kode";
    if (on) label.setAttribute("aria-label", "Memeriksa"); else label.removeAttribute("aria-label");
  }

  function showFail(title, text) {
    result.innerHTML = "";
    const card = document.createElement("div");
    card.className = "card fail";
    const h = document.createElement("h2"); h.textContent = title;
    const p = document.createElement("p"); p.textContent = text;
    card.append(h, p);
    result.appendChild(card);
  }

  function showLink(link) {
    const url = parse(link);
    if (!url) return showFail("Link tidak valid", "Kode ditemukan, tetapi link di spreadsheet bukan alamat http/https yang valid.");

    const card = document.createElement("div");
    card.className = "card ok found";

    const check = document.createElement("div");
    check.className = "found-ico";
    check.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    const h = document.createElement("h2");
    h.textContent = "Link ditemukan";
    const p = document.createElement("p");
    p.textContent = "Silakan tekan Masuk untuk membuka tautan.";

    const go = document.createElement("a");
    go.className = "open"; go.href = url.href; go.target = "_blank"; go.rel = "noopener noreferrer";
    go.textContent = "Masuk";

    card.append(check, h, p, go);
    result.innerHTML = "";
    result.appendChild(card);
    notify("ok", "Link ditemukan", "Silakan tekan Masuk.");
    go.focus({ preventScroll: false });
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const kode = input.value.trim();
    input.classList.remove("bad");
    result.innerHTML = "";

    if (!kode) {
      input.classList.add("bad");
      showFail("Kode belum diisi", "Ketik kode terlebih dahulu, lalu tekan Cek kode.");
      input.focus();
      return;
    }

    setLoading(true);
    try {
      const res = await fetch(EXEC_URL + "?kode=" + encodeURIComponent(kode), { redirect: "follow" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "Terjadi kesalahan");

      setStatus("ok");
      if (json.found) {
        showLink(json.link);
      } else {
        input.classList.add("bad");
        showFail("Kode tidak ditemukan", "Periksa kembali kode Anda, lalu coba lagi.");
      }
    } catch (err) {
      setStatus("error");
      notify("error", "Belum tersambung ke spreadsheet", "Coba lagi beberapa saat.");
      showFail("Tidak bisa memeriksa kode", err.message + ". Pastikan koneksi aktif dan deployment Apps Script sudah diset ke “Anyone”.");
    } finally {
      setLoading(false);
    }
  });

  input.addEventListener("input", () => input.classList.remove("bad"));

  checkConnection();
</script>
</body>
</html>
